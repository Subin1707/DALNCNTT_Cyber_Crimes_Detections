<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Generic Graph Visualization (Neo4j)</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --panel: #f9fafb;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            color: var(--text);
            background: var(--bg);
        }

        header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 650;
        }

        header p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.4;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 16px;
            padding: 16px;
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        #network {
            width: 100%;
            height: 640px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            overflow: hidden;
        }

        .panel .panel-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        .panel .panel-header .title {
            font-size: 14px;
            font-weight: 650;
            margin: 0;
        }

        .panel .panel-header .subtitle {
            margin: 6px 0 0;
            font-size: 12px;
            color: var(--muted);
        }

        .panel .panel-body {
            padding: 12px 14px;
        }

        .kv {
            display: grid;
            grid-template-columns: 86px 1fr;
            gap: 8px 10px;
            align-items: start;
            font-size: 13px;
        }

        .kv .k {
            color: var(--muted);
        }

        pre {
            margin: 10px 0 0;
            padding: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: auto;
            font-size: 12px;
            line-height: 1.35;
        }
    </style>
</head>

<body>
    <header>
        <h2>Generic Graph Visualization (Neo4j)</h2>
        <p>
            Click một node/cạnh để xem chi tiết. Màu node theo <b>type</b>, nhãn cạnh theo <b>relation</b>,
            tooltip/panel hiển thị <b>attributes</b>.
        </p>
    </header>

    <div class="layout">
        <div id="network"></div>
        <aside class="panel" aria-label="Chi tiết">
            <div class="panel-header">
                <p class="title">Chi tiết</p>
                <p class="subtitle" id="summary">Chưa chọn gì</p>
            </div>
            <div class="panel-body">
                <div class="kv">
                    <div class="k">Loại</div>
                    <div class="v" id="detail-kind">—</div>
                    <div class="k">ID/From</div>
                    <div class="v" id="detail-id">—</div>
                    <div class="k">To</div>
                    <div class="v" id="detail-to">—</div>
                    <div class="k">Type/Rel</div>
                    <div class="v" id="detail-type">—</div>
                </div>
                <pre id="detail-attrs">{}</pre>
            </div>
        </aside>
    </div>

    <script>
        fetch('/api/graph')
            .then(res => res.json())
            .then(payload => {

                // API chuẩn: { data: { nodes: [...], edges: [...] }, message: "OK" }
                const data = payload?.data;

                if (!data) {
                    document.getElementById("network").innerText = "Lỗi tải dữ liệu";
                    return;
                }

                if (!data.nodes || data.nodes.length === 0) {
                    document.getElementById("network").innerText = "Không có dữ liệu đồ thị";
                    return;
                }

                const safeStringify = (value) => {
                    try {
                        return JSON.stringify(value ?? {}, null, 2);
                    } catch {
                        return "{}";
                    }
                };

                const escapeHtml = (s) => String(s)
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#39;");

                const formatTooltip = (title, obj) => {
                    const json = escapeHtml(safeStringify(obj));
                    return `<div style="max-width:320px"><div style="font-weight:650;margin-bottom:6px">${escapeHtml(title)}</div><pre style="margin:0;white-space:pre-wrap">${json}</pre></div>`;
                };

                const nodeById = new Map((data.nodes || []).map(n => [n.id, n]));

                const nodes = new vis.DataSet(
                    data.nodes.map(n => ({
                        id: n.id,
                        label: n.id,
                        group: n.type,
                        title: formatTooltip(`Node ${n.id} (${n.type})`, n.attributes)
                    }))
                );

                const edges = new vis.DataSet(
                    (data.edges || []).map(e => ({
                        from: e.from,
                        to: e.to,
                        label: e.relation,
                        title: formatTooltip(`Edge ${e.from} → ${e.to} (${e.relation})`, e.attributes),
                        arrows: 'to'
                    }))
                );

                const container = document.getElementById("network");
                const network = new vis.Network(
                    container,
                    { nodes, edges },
                    {
                        physics: true,
                        interaction: { hover: true, tooltipDelay: 120 },
                        nodes: {
                            shape: 'dot',
                            size: 16,
                            font: { size: 14 }
                        },
                        edges: {
                            font: { size: 12, align: 'horizontal' },
                            smooth: { type: 'dynamic' }
                        }
                    }
                );

                const summaryEl = document.getElementById('summary');
                const kindEl = document.getElementById('detail-kind');
                const idEl = document.getElementById('detail-id');
                const toEl = document.getElementById('detail-to');
                const typeEl = document.getElementById('detail-type');
                const attrsEl = document.getElementById('detail-attrs');

                const setDetails = ({ kind, id, to, type, attrs }) => {
                    summaryEl.textContent = kind ? `Đang chọn: ${kind}` : 'Chưa chọn gì';
                    kindEl.textContent = kind || '—';
                    idEl.textContent = id || '—';
                    toEl.textContent = to || '—';
                    typeEl.textContent = type || '—';
                    attrsEl.textContent = safeStringify(attrs || {});
                };

                setDetails({ kind: null, id: null, to: null, type: null, attrs: {} });

                network.on('select', params => {
                    if (params.nodes && params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        const n = nodeById.get(nodeId);
                        setDetails({
                            kind: 'Node',
                            id: nodeId,
                            to: null,
                            type: n?.type,
                            attrs: n?.attributes
                        });
                        return;
                    }

                    if (params.edges && params.edges.length > 0) {
                        const edgeId = params.edges[0];
                        const e = edges.get(edgeId);
                        const raw = (data.edges || []).find(x => x.from === e.from && x.to === e.to && x.relation === e.label);
                        setDetails({
                            kind: 'Edge',
                            id: e.from,
                            to: e.to,
                            type: raw?.relation ?? e.label,
                            attrs: raw?.attributes
                        });
                        return;
                    }

                    setDetails({ kind: null, id: null, to: null, type: null, attrs: {} });
                });
            })
            .catch(err => {
                document.getElementById("network").innerText = "Lỗi tải dữ liệu";
                console.error(err);
            });
    </script>

</body>

</html>
