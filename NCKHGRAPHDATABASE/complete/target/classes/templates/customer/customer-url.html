<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer - Quản lý URL</title>

    <link rel="stylesheet" th:href="@{/css/customer.css}">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <script th:src="@{/theme.js}"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body class="page-index">
<main class="container">

    <header class="dashboard-header">
        <div>
            <h1>URL Management</h1>
            <p th:if="${user != null}">
                Chào <strong th:text="${user.email}"></strong>
                (Role: <span th:text="${user.role}"></span>)
            </p>
            <p th:if="${user == null}" class="warning">Chưa đăng nhập</p>
        </div>

        <a th:href="@{/customer/logout}" class="logout-btn">Logout</a>
    </header>

    <section class="card">
        <h2>Phân tích URL</h2>

        <form class="form-inline" onsubmit="return false;" autocomplete="off">
            <input type="text" id="analyzeURL" placeholder="Nhập URL, ví dụ: https://example.com" required autocomplete="off" spellcheck="false">
            <button type="button" id="analyzeBtn">Phân tích</button>
        </form>

        <div id="analyzeResult"></div>
    </section>

    <section class="card">
        <h2>Đồ thị URL</h2>
        <div class="graph-controls">
            <select id="sessionSelect"></select>
            <button id="reloadGraphBtn">Tải lại</button>
            <span id="graphLoading" style="display:none;margin-left:8px">Loading...</span>
        </div>

        <div id="selectedSessionArea" style="margin-top:8px;">
            <b>Phiên:</b>
            <span id="selectedSessionLabel">Tất cả dữ liệu (ALL)</span>
        </div>

        <div class="graph-wrapper">
            <svg id="graphSVG" width="1000" height="600"></svg>
        </div>
    </section>

    <section class="card">
        <h2>Bảng URL Node</h2>

        <div class="table-search">
            <input type="text" id="searchNode" placeholder="Tìm URL..." autocomplete="off" spellcheck="false">
            <button type="button" id="searchNodeBtn">Tìm</button>
            <button type="button" id="resetNodeBtn">Reset</button>
        </div>

        <div class="table-wrapper">
            <table id="nodeTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Value</th>
                    <th>Status</th>
                    <th>Risk Level</th>
                    <th>Risk Score</th>
                    <th>Verdict</th>
                    <th>Indicators</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

</main>

<script>
    window.CUSTOMER_VIEW_TYPE = "URL";
</script>

<script th:src="@{/js/customer-main.js}"></script>
<script th:src="@{/js/customer-session.js}"></script>
<script th:src="@{/js/customer-url-analyze.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>

<aside class="sidebar-left" aria-label="Thanh điều hướng">
    <div class="sidebar-title">Điều hướng</div>
    <div class="nav-buttons">
        <button onclick="location.href='/dashboard'">Dashboard</button>
        <button onclick="location.href='/customer/customer-email'">Quản lý Email</button>
        <button onclick="location.href='/customer/customer-ip'">Quản lý IP</button>
        <button onclick="location.href='/customer/customer-url'">Quản lý URL</button>
        <button onclick="location.href='/customer/about'">Giới thiệu</button>
    </div>
</aside>

</body>
</html>
