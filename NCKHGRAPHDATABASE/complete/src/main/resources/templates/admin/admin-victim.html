<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Victim account</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <script th:src="@{/theme.js}"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body class="page-index">

<main class="container">

    <header class="dashboard-header">
        <div>
            <h1>Quản lý Victim account</h1>

            <p th:if="${user != null}">
                Chào <strong th:text="${user.email}"></strong>
                (Role: <span th:text="${user.role}"></span>)
            </p>

            <p th:if="${user == null}" class="warning">
                ⚠ Chưa đăng nhập
            </p>
        </div>

        <a th:href="@{/admin/logout}" class="logout-btn" title="Đăng xuất">Logout</a>
    </header>

    <!-- Nav moved to left sidebar for dashboard-style layout -->

    <section class="card">
        <h2>Phân tích Victim account</h2>

        <form class="form-inline" onsubmit="return false;">
            <input type="text" id="analyzeVictimAccount"
                   placeholder="Nhập Victim account cần phân tích"
                   autocomplete="off">

            <button type="button" id="analyzeVictimAccountBtn" title="Click để phân tích Victim account">
                Phân tích
            </button>
        </form>

        <div id="analyzeResult" class="analyze-result"></div>
    </section>

    <section class="card">
        <h2>Đồ thị Victim account</h2>

        <div class="graph-controls">
            <select id="sessionSelect"></select>
            <button id="reloadGraphBtn">Tải lại</button>
            <span id="graphLoading" style="display:none;margin-left:8px">Loading...</span>
        </div>

        <div class="graph-wrapper">
            <svg id="graphSVG" width="1000" height="600"></svg>
        </div>
    </section>

    <div id="nodeInfo"></div>

    <section class="card">
        <h2>Bảng Victim account</h2>

        <div class="table-search">
            <input type="text" id="searchNode"
                   placeholder="Tìm theo ID hoặc Value..."
                   autocomplete="off">
            <button type="button" id="searchNodeBtn">Tìm kiếm</button>
            <button type="button" id="resetNodeBtn">Reset</button>
        </div>

        <div class="table-wrapper">
            <table id="nodeTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Value</th>
                    <th>Status</th>
                    <th>Risk Level</th>
                    <th>Risk Score</th>
                    <th>Verdict</th>
                    <th>Indicators</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <h2>Bảng Sessions</h2>
        <div class="table-wrapper">
            <table id="finalTable">
                <thead>
                <tr>
                    <th>SessionId</th>
                    <th>Emails</th>
                    <th>IPs</th>
                    <th>URLs</th>
                    <th>Max Risk</th>
                    <th>Max Score</th>
                    <th>Verdict</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

</main>

<script>
    window.ADMIN_VIEW_TYPE = "VictimAccount";
</script>

<script th:src="@{/js/admin-main.js}"></script>
<script th:src="@{/js/role-enhanced-analysis.js}"></script>
<script th:src="@{/js/admin-session.js}"></script>
<script th:src="@{/js/admin-victim-analyze.js}"></script>

<script>
    document.getElementById("searchNode")?.addEventListener("keypress", (e) => {
        if (e.key === "Enter") document.getElementById("searchNodeBtn")?.click();
    });
</script>

<!-- Sidebar toggle script -->
<script th:src="@{/js/sidebar-toggle.js}"></script>

<aside class="sidebar-left" aria-label="Thanh điều hướng">
    <div class="sidebar-title">Điều hướng</div>
    <div class="nav-buttons">
        <button onclick="location.href='/dashboard'">Dashboard</button>
        <button onclick="location.href='/admin/admin-email'">Quản lý Email</button>
        <button onclick="location.href='/admin/admin-ip'">Quản lý IP</button>
        <button onclick="location.href='/admin/admin-url'">Quản lý URL</button>
        <button onclick="location.href='/admin/admin-domain'">Quản lý Domain</button>
        <button onclick="location.href='/admin/admin-file'">Quản lý File name</button>
        <button onclick="location.href='/admin/admin-filehash'">Quản lý File hash</button>
        <button onclick="location.href='/admin/admin-victim'">Quản lý Victim account</button>
        <button onclick="location.href='/admin/user-management'">Quản lý Tài khoản</button>
        <button onclick="location.href='/admin/about'">Giới thiệu</button>
    </div>
</aside>

</body>
</html>
